name: LiteLLM compatibility tests
description: Run MLPA's compatibility suite against LiteLLM, PostgreSQL, and Redis.
inputs:
  image:
    description: Optional LiteLLM image override; defaults to the Compose image.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      shell: bash
      run: pip install uv==0.10.8

    - name: Sync dependencies
      shell: bash
      run: |
        uv venv
        uv sync --all-groups
        uv pip install --no-cache-dir -e .

    - name: Configure test environment
      shell: bash
      run: |
        echo "MASTER_KEY=sk-default" > .env
        echo "COMPOSE_FILE=litellm_docker_compose.yaml" >> "$GITHUB_ENV"

    - name: Override LiteLLM image for this run
      if: inputs.image != ''
      shell: bash
      env:
        LITELLM_IMAGE: ${{ inputs.image }}
      run: |
        override_file="$RUNNER_TEMP/litellm-image.yaml"
        cat > "$override_file" <<EOF
        services:
          litellm:
            image: "$LITELLM_IMAGE"
        EOF

        # Load the override after the base file so only the image changes.
        echo "COMPOSE_FILE=litellm_docker_compose.yaml:$override_file" >> "$GITHUB_ENV"

    - name: Pull candidate image
      if: inputs.image != ''
      shell: bash
      env:
        LITELLM_IMAGE: ${{ inputs.image }}
      run: |
        # Compose takes a service name and pulls its overridden image.
        docker compose pull litellm
        docker image inspect "$LITELLM_IMAGE" --format '{{json .RepoDigests}}'

    - name: Start compatibility test stack
      shell: bash
      run: docker compose up -d

    - name: Wait for LiteLLM to be ready
      shell: bash
      run: |
        for _ in $(seq 1 60); do
          if curl -sf http://localhost:4000/health/liveliness > /dev/null; then
            echo "LiteLLM is up"
            exit 0
          fi
          sleep 2
        done
        echo "LiteLLM did not become ready in time"
        docker compose logs
        exit 1

    - name: Migrate app_attest database
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        bash scripts/migrate-app-attest-database-local.sh

    - name: Create MLPA virtual key
      shell: bash
      run: uv run python scripts/create-and-set-virtual-key.py

    - name: Run LiteLLM compatibility tests
      env:
        MLPA_TEST_REQUIRE_REAL_BACKEND: "true"
      shell: bash
      run: uv run pytest src/tests/litellm_compatibility -v --junit-xml=litellm-compatibility-results.xml

    - name: Summarize failures
      if: always()
      shell: bash
      run: |
        uv run python scripts/ci_failure_summary.py litellm-compatibility-results.xml \
          "> A failure here may indicate that the selected LiteLLM image broke a documented contract -- see the checks below for what each one verifies."

    - name: Stop compatibility test stack
      if: always()
      shell: bash
      run: docker compose down -v
