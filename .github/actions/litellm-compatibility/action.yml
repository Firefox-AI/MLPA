name: LiteLLM compatibility tests
description: Run MLPA's compatibility suite against LiteLLM, PostgreSQL, and Redis.
inputs:
  image:
    description: Optional LiteLLM image override; defaults to the Compose image.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      shell: bash
      run: pip install uv==0.10.8

    - name: Sync dependencies
      shell: bash
      run: |
        uv venv
        uv sync --all-groups
        uv pip install --no-cache-dir -e .

    - name: Configure LiteLLM env
      shell: bash
      env:
        LITELLM_IMAGE: ${{ inputs.image }}
      run: |
        echo "MASTER_KEY=sk-default" > .env
        echo "COMPOSE_FILE=litellm_docker_compose.yaml" >> "$GITHUB_ENV"
        if [ -n "$LITELLM_IMAGE" ]; then
          python - <<'PYTHON'
        import json
        import os
        from pathlib import Path

        override = Path(os.environ["RUNNER_TEMP"]) / "litellm-image.json"
        override.write_text(json.dumps({
            "services": {"litellm": {"image": os.environ["LITELLM_IMAGE"]}}
        }))
        with open(os.environ["GITHUB_ENV"], "a") as env:
            env.write(f"COMPOSE_FILE=litellm_docker_compose.yaml:{override}\n")
        PYTHON
        fi

    - name: Pull candidate image
      if: inputs.image != ''
      shell: bash
      env:
        LITELLM_IMAGE: ${{ inputs.image }}
      run: |
        docker compose pull litellm
        docker image inspect "$LITELLM_IMAGE" --format '{{json .RepoDigests}}'

    - name: Start LiteLLM + Postgres + Redis
      shell: bash
      run: docker compose up -d

    - name: Wait for LiteLLM to be ready
      shell: bash
      run: |
        for _ in $(seq 1 60); do
          if curl -sf http://localhost:4000/health/liveliness > /dev/null; then
            echo "LiteLLM is up"
            exit 0
          fi
          sleep 2
        done
        echo "LiteLLM did not become ready in time"
        docker compose logs
        exit 1

    - name: Migrate app_attest database
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y postgresql-client
        bash scripts/migrate-app-attest-database-local.sh

    - name: Create MLPA virtual key
      shell: bash
      run: uv run python scripts/create-and-set-virtual-key.py

    - name: Run LiteLLM compatibility tests
      env:
        MLPA_TEST_REQUIRE_REAL_BACKEND: "true"
      shell: bash
      run: uv run pytest src/tests/litellm_compatibility -v --junit-xml=litellm-compatibility-results.xml

    - name: Summarize failures
      if: always()
      shell: bash
      run: |
        uv run python scripts/ci_failure_summary.py litellm-compatibility-results.xml \
          "> A failure here usually means the pinned LiteLLM version broke a documented contract -- see the checks below for what each one verifies."

    - name: Stop LiteLLM + Postgres + Redis
      if: always()
      shell: bash
      run: docker compose down -v
