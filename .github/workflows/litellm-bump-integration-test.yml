name: litellm version check

on:
  pull_request:
    paths:
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        run: |
          read_version() {
            sed -n 's|^[[:space:]]*image:[[:space:]]*ghcr\.io/berriai/litellm:\(.*\)$|\1|p' "$1"
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          git show "$BASE_SHA:litellm_docker_compose.yaml" > /tmp/base-compose.yaml 2>/dev/null || : > /tmp/base-compose.yaml
          OLD=$(read_version /tmp/base-compose.yaml)
          NEW=$(read_version litellm_docker_compose.yaml)

          echo "old=$OLD new=$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  litellm-integration:
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: pip install uv==0.10.8

      - name: Sync dependencies
        run: |
          uv venv
          uv sync --all-groups
          uv pip install --no-cache-dir -e .

      - name: Configure LiteLLM env
        run: echo "MASTER_KEY=sk-default" > .env

      - name: Start LiteLLM + Postgres + Redis
        run: docker compose -f litellm_docker_compose.yaml up -d

      - name: Wait for LiteLLM to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health/liveliness > /dev/null; then
              echo "LiteLLM is up"
              exit 0
            fi
            sleep 2
          done
          echo "LiteLLM did not become ready in time"
          docker compose -f litellm_docker_compose.yaml logs
          exit 1

      - name: Run integration tests
        env:
          MLPA_TEST_REQUIRE_REAL_BACKEND: "true"
        run: uv run pytest src/tests/integration -v

      - name: Stop LiteLLM + Postgres + redis
        if: always()
        run: docker compose -f litellm_docker_compose.yaml down -v
