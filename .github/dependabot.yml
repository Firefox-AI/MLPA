version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      # Group minor and patch updates into one PR.
      # Major updates remain as individual PRs.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Limit the number of concurrent version-update PRs.
    # This does not limit dependencies per grouped PR.
    open-pull-requests-limit: 5

  # Bumps the pinned LiteLLM image tag in litellm_docker_compose.yaml. The PR
  # runs like any other via linters_and_tests.yml, which is what exercises the
  # upgrade: test_litellm_contract.py (AIPLAT-910) and e2e/litellm_compat
  # (AIPLAT-1337).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
